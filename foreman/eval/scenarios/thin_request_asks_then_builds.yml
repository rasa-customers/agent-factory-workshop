scenario:
  name: A thin request gets at most two questions, then a build
  type: happy_path
  simulation_context: >
    You want "a dashboard". When asked what it should show, say: my flight status, the weather where I land,
    and whether I will make my meeting. Answer any other question briefly. Agree when asked to send it to
    the factory.
  goals:
    criteria:
      - The agent asks no more than two clarifying questions before restating the spec
      - The agent restates the spec and asks before starting the build
    assertions:
      - tool_executed:
          tool_name: start_build
          source: mcp
          mcp_server: factory
