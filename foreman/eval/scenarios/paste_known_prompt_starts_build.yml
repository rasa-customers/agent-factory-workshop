scenario:
  name: Pasting the known dashboard brief starts a build straight away
  type: happy_path
  simulation_context: >
    You are a workshop attendee. Your first message is exactly this brief: "Build a flight dashboard for a
    traveller flying to New York. It shows four panels: the flight (number, status, delay, gate and the gate
    it changed from, arrival time), the weather when they land, their next meeting (time and address), and a
    verdict saying whether they will make the meeting with how many minutes of slack. It updates live." Then
    wait for the agent's answer and say thanks.
  goals:
    criteria:
      - The agent does not ask any clarifying question before starting the build
      - The agent shares a link to watch the build
    assertions:
      - tool_executed:
          tool_name: start_build
          source: mcp
          mcp_server: factory
          arguments:
            kind: dashboard
