schema:
  public:
    kind:
      type: categorical
      enum_values: [dashboard, mantle_agent]
      llm_settable: true
      description: >
        What the person wants built - dashboard (a web page / UI / display) or mantle_agent (a chatbot,
        assistant, or conversational agent). Set it only once it is clear from what they said.
    brief_approved:
      type: bool
      llm_settable: true
      description: >
        Whether the person has approved the brief most recently saved with save_brief. Set false every
        time you save a brief. Set true only when, after seeing that brief, they say yes, go, or build it
        (or when they pasted a long brief themselves). Answers to your questions do not set this.
