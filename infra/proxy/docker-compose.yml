# Proxy + its database. The portal stack (infra/portal/docker-compose.yml) includes this file.
services:
  litellm-db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes: [litellm-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/litellm.yaml", "--port", "4000"]
    volumes: [./litellm.yaml:/app/litellm.yaml:ro]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "False"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      litellm-db: {condition: service_healthy}
    restart: unless-stopped

volumes:
  litellm-db:
