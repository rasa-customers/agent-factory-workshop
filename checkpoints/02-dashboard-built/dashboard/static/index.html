<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Dashboard — NYC Trip</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__title">Flight Dashboard</div>
      <div class="brand__subtitle">Trip to New York • Live updates</div>
    </div>
    <div class="actions">
      <button id="btnClear" class="btn btn--ghost" type="button" title="Clear dashboard">Clear</button>
    </div>
  </header>

  <main class="grid" id="grid">
    <section class="panel" id="panel-flight" aria-labelledby="h-flight">
      <div class="panel__head">
        <h2 class="panel__title" id="h-flight">Flight</h2>
        <div class="panel__meta" id="meta-flight">Waiting for flight details…</div>
      </div>
      <div class="panel__body" id="body-flight"></div>
    </section>

    <section class="panel" id="panel-weather" aria-labelledby="h-weather">
      <div class="panel__head">
        <h2 class="panel__title" id="h-weather">Weather when you land</h2>
        <div class="panel__meta" id="meta-weather">Waiting for landing weather…</div>
      </div>
      <div class="panel__body" id="body-weather"></div>
    </section>

    <section class="panel" id="panel-meeting" aria-labelledby="h-meeting">
      <div class="panel__head">
        <h2 class="panel__title" id="h-meeting">Your meeting</h2>
        <div class="panel__meta" id="meta-meeting">Waiting for meeting details…</div>
      </div>
      <div class="panel__body" id="body-meeting"></div>
    </section>

    <section class="panel" id="panel-verdict" aria-labelledby="h-verdict">
      <div class="panel__head">
        <h2 class="panel__title" id="h-verdict">Will you make it?</h2>
        <div class="panel__meta" id="meta-verdict">Waiting for timing verdict…</div>
      </div>
      <div class="panel__body" id="body-verdict"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="status" id="connStatus">Connecting…</div>
    <div class="status__hint">Updates stream live; page never reloads.</div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
