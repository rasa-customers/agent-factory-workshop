model_groups:
  - id: main_model
    models:
      - provider: openai
        model: ${FACTORY_MODEL}
        api_base: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
channels:
  rest: { enabled: true }
  inspector: { enabled: true }
mcp_servers:
  - name: travel
    url: http://localhost:8700/mcp/
    tool_timeout: 30
